version: '3.8'

services:
  novabot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novabot-backend
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PORT=3001
      - PYTHONUNBUFFERED=1
