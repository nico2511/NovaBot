version: '3.8'

services:
  novabot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novabot
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=3001
